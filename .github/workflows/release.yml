name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend deps
        run: npm install

      - name: Fetch bundled Node.js 22 LTS
        shell: bash
        run: |
          NODE_VERSION="22.13.0"
          mkdir -p src-tauri/resources/node
          if [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-win-x64.zip" -o node.zip
            unzip -q node.zip
            cp -r "node-v${NODE_VERSION}-win-x64/"* src-tauri/resources/node/
          else
            ARCH="${{ matrix.args == '--target x86_64-apple-darwin' && 'x64' || 'arm64' }}"
            curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-darwin-${ARCH}.tar.gz" -o node.tar.gz
            tar -xzf node.tar.gz
            cp -r "node-v${NODE_VERSION}-darwin-${ARCH}/"* src-tauri/resources/node/
          fi
          ls -la src-tauri/resources/node

      - name: Fetch bundled pnpm
        shell: bash
        run: |
          PNPM_VERSION="11.24.0"
          mkdir -p src-tauri/resources/node/pnpm
          curl -fsSL "https://registry.npmmirror.com/pnpm/-/pnpm-${PNPM_VERSION}.tgz" -o pnpm.tgz
          tar -xzf pnpm.tgz
          cp -r package/bin package/dist package/package.json src-tauri/resources/node/pnpm/
          ls -la src-tauri/resources/node/pnpm

      - name: Install Linux deps (skip)
        if: matrix.platform == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DSH Desktop ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
